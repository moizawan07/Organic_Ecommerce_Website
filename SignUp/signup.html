<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Sign Up</title>
    <link rel="stylesheet" href="signup.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Left Side (For Design Purpose) -->
        <div class="left">
            <div>
                <h2>Join Us Today!</h2>
                <p>Create an account and enjoy easy and quick shopping.</p>
            </div>
        </div>

        <!-- Right Side (Signup Form) -->
        <div class="right">
            <h1>Sign Up</h1>
            <p>Create an account to order your favorite products easily.</p>

            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="Name" placeholder="Name" required>
            </div>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="Email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <i class="fas fa-phone"></i>
                <input type="number" id="phonenumber" placeholder="Phone Number" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="Password" placeholder="Password" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-location-dot"></i>
                <input type="text" id="location" placeholder="Location" required>
            </div>

            <div class="button-container">
                <button onclick="signUp()">Sign Up</button>
            </div>

            <div class="social-buttons">
                <button class="f"><i class="fab fa-facebook"></i> Login With Facebook</button>
                <button class="g"><i class="fab fa-google"></i> Login With Google</button>
            </div>

            <p class="signup-link">Already have an account? <a href="../login/login.html">Login</a></p>
        </div>
    </div>

    <script type="module" src="../JavaScript/firebase.js"></script>
    <script type="module" src="../JavaScript/app.js"></script>
</body>
</html>
