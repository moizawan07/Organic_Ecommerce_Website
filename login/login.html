<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="container">
        <!-- Left Side (For Design Purpose) -->
        <div class="left">
            <div>
                <h2>Welcome Back!</h2>
                <p>Sign in to access your account and explore amazing features.</p>
            </div>
        </div>

        <!-- Right Side (Login Form) -->
        <div class="right">
            <h1>Login</h1>
            <p>Sign in to your account</p>

            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email2" placeholder="Email" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password2" placeholder="Password" required>
            </div>

            <div class="button-container">
                <button onclick="login()">Login</button>
            </div>

            <p class="signup-link">Don't have an account? <a href="../SignUp/signup.html">Sign Up</a></p>
        </div>
    </div>

    <script type="module" src="../JavaScript/firebase.js"></script>
    <script type="module" src="../JavaScript/app.js"></script>

</body>
</html>
